# Sitio de NativaTrips. La API va por el mismo origen, asi que el navegador no necesita CORS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Las fotos y la biblioteca pesan: hasta 25 MB por carga.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~ ^/(v3/api-docs|swagger-ui) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Archivos con huella en el nombre: no cambian nunca.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Fotos de los senderos: cambian poco y pesan; una semana en cache.
    location /fotos/ {
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Rutas de la aplicacion (React Router): siempre index.html, sin cache.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ /index.html;
    }
}
