name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build, test and check coverage (JaCoCo)
        working-directory: .
        run: ./mvnw -B verify
        env:
          APP_JWT_SECRET: ci-only-secret-not-for-production-min-32-bytes-long

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload OpenAPI contract
        uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: target/openapi.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: Type check and production build
        run: npm run build

  contenedores:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compose valido y con todas sus variables
        run: docker compose config -q
        env:
          APP_JWT_SECRET: ci-only-secret-not-for-production-min-32-bytes-long

      - name: Imagenes del backend y del sitio
        run: docker compose build backend frontend
        env:
          APP_JWT_SECRET: ci-only-secret-not-for-production-min-32-bytes-long
