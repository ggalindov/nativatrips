name: Accesibilidad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # La revisión con axe corre con el resto de pruebas en el trabajo frontend del flujo CI.
      # Aquí, accesibilidad por debajo de 95 hace fallar el trabajo; rendimiento, buenas prácticas y SEO solo avisan.
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Subir los reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: frontend/lighthouse/
          retention-days: 14
