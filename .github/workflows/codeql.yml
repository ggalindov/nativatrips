name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  analizar:
    name: analizar (${{ matrix.lenguaje }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        lenguaje: [java-kotlin, javascript-typescript, actions]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.lenguaje }}
          build-mode: none
          queries: security-extended

      - name: Analizar
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.lenguaje }}
