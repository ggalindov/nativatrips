name: Error
description: Algo no funciona como debería
title: "fix: "
labels: ["error"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Lo que se observa, con el mensaje de error si lo hay.
    validations:
      required: true
  - type: textarea
    id: que-deberia
    attributes:
      label: Qué debería pasar
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ir a ...
        2. Hacer clic en ...
        3. Ver el error
    validations:
      required: true
  - type: dropdown
    id: modulo
    attributes:
      label: Módulo
      options:
        - Senderos
        - Reservas
        - Capacidad
        - Pagos
        - Asistente
        - Usuarios
        - Notificaciones
        - Frontend
        - Infraestructura
    validations:
      required: true
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options:
        - Crítica (bloquea reservas o pagos)
        - Alta
        - Media
        - Baja
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: Chrome Android, Safari iOS, Edge escritorio...
  - type: input
    id: jira
    attributes:
      label: Incidencia en Jira
      placeholder: NAT-
