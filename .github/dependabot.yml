# Revisión semanal de dependencias. Las actualizaciones menores y de parche llegan en un solo PR
# por ecosistema. Las mayores no se proponen: se revisan a mano en el receso, una por una, porque
# suelen traer cambios que rompen. Java 21 y PostgreSQL 16 son versiones fijas del proyecto.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    groups:
      backend-menores:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    groups:
      frontend-menores:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: America/Bogota
    commit-message:
      prefix: ci(deps)
    groups:
      acciones:
        patterns: ["*"]

  # Las imágenes de Maven y de Temurin llevan la versión de Java en la etiqueta
  # (3.9-eclipse-temurin-21): Dependabot propondría saltar de Java, así que se actualizan a mano.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      timezone: America/Bogota
    commit-message:
      prefix: build(deps)
    ignore:
      - dependency-name: maven
      - dependency-name: eclipse-temurin
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Imagen del sitio: Node se queda en la LTS 22 y Nginx en su rama estable.
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
      timezone: America/Bogota
    commit-message:
      prefix: build(deps)
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
      timezone: America/Bogota
    commit-message:
      prefix: build(deps)
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
