# Correos al turista en frances. Mismas claves que correos.properties. Se usa la comilla
# tipografica (U+2019) para que MessageFormat no la interprete como escape.

cupo.asunto=Votre place est réservée - NativaTrips {0}
cupo.cuerpo=Bonjour {0}. Nous gardons {1} place(s) sur {2} pour le {3}. Votre code de réservation est {4}. La place est gardée jusqu’à {5} (heure de Colombie) pendant que vous effectuez le paiement.\n\nDepuis ce lien, vous payez, enregistrez vos accompagnants et consultez votre réservation :\n{6}\n\nIl est personnel : ne le partagez pas. Si vous le perdez, demandez-en un nouveau avec votre e-mail et le code.

revision.asunto=Nous avons reçu votre demande - NativaTrips {0}
revision.cuerpo=Bonjour {0}. Nous gardons {1} place(s) sur {2} pour le {3}. Comme il s’agit d’un {4}, l’équipe d’Eco Palacio l’examine avant le paiement. Nous vous écrirons dès son approbation ; à partir de ce moment, vous aurez {5} minutes pour payer.\n\nDepuis ce lien, vous consultez l’état de votre réservation :\n{6}\n\nIl est personnel : ne le partagez pas.
grupo.corporativo=groupe d’entreprise
grupo.especial=groupe aux besoins particuliers

aprobada.asunto=Votre réservation a été approuvée - NativaTrips {0}
aprobada.cuerpo=Bonjour {0}. L’équipe a approuvé votre réservation sur {1} pour le {2}. Vous avez jusqu’à {3} (heure de Colombie) pour payer depuis ce lien :\n\n{4}\n\nLes liens reçus auparavant ne fonctionnent plus.
aprobada.senderoDesconocido=le sentier

rechazada.asunto=Votre réservation n’a pas été approuvée - NativaTrips {0}
rechazada.cuerpo=Bonjour {0}. L’équipe d’Eco Palacio n’a pas pu approuver votre réservation pour le {1}{2}\n\nAucun paiement n’a été prélevé et les places ont été libérées. Écrivez-nous si vous souhaitez trouver une autre date.

comprobante.asunto=Reçu de paiement - NativaTrips {0}
comprobante.titulo=Votre paiement a été approuvé et votre réservation est confirmée.
comprobante.reserva=Réservation : {0}
comprobante.sendero=Sentier : {0}
comprobante.fecha=Date : {0}, départ à {1}
comprobante.punto=Point de rendez-vous : {0}
comprobante.personas=Personnes : {0}
comprobante.valor=Montant payé : {0}
comprobante.transaccion=Transaction Wompi : {0}
comprobante.referencia=Référence : {0}
comprobante.fechaPago=Date du paiement : {0} (heure de Colombie)
comprobante.cierre=Cet e-mail est votre reçu. Il n’y a pas de remboursement ; si vous devez changer de date, demandez une reprogrammation depuis le lien de votre réservation.

rechazo.asunto=Votre paiement n’a pas été approuvé - NativaTrips {0}
rechazo.reintentar=Wompi n’a pas approuvé le paiement de {0}. Vous pouvez réessayer depuis le lien de votre réservation : il vous reste {1} tentative(s) et la place est gardée jusqu’à {2} (heure de Colombie).
rechazo.cancelada=Wompi n’a pas approuvé le paiement de {0} pour la troisième fois ; la réservation a donc été annulée et la place libérée. Vous pouvez faire une nouvelle réservation quand vous le souhaitez.

previo.asunto=Votre sortie à {0} a lieu dans deux jours - NativaTrips {1}
previo.salida={0} à {1}
previo.puntoDesconocido=le point indiqué par l’équipe
previo.cuerpo=Bonjour {0}. Nous vous attendons le {1} à {2}, {3} personne(s). Arrivez 20 minutes à l’avance.
previo.requisitos=\n\nPour entrer : {0}
previo.cierre=\n\nQuoi emporter, comment s’habiller contre le froid et comment éviter le mal de l’altitude :\n{0}/antes-de-subir\n\nSi la météo ou le sentier changent, nous vous écrirons. Pour consulter votre réservation, utilisez le lien envoyé lors de la réservation.

historial.asunto=Vos réservations sur NativaTrips
historial.cuerpo=Bonjour. Vous avez demandé à voir les réservations faites avec cet e-mail. Ce lien est valable 24 heures :\n\n{0}\n\nSi vous ne l’avez pas demandé, ignorez cet e-mail : personne d’autre ne peut l’ouvrir.

enlace.asunto=Votre nouveau lien de réservation - NativaTrips {0}
enlace.cuerpo=Bonjour {0}. Voici le nouveau lien de votre réservation {1} ; l’ancien ne fonctionne plus :\n\n{2}\n\nSi vous ne l’avez pas demandé, ne faites rien : seule une personne ayant accès à votre e-mail peut l’utiliser.

reprogramacion.solicitada.asunto=Nous avons reçu votre demande de changement de date - NativaTrips {0}
reprogramacion.solicitada.cuerpo=Bonjour {0}. Nous avons reçu votre demande pour déplacer votre sortie à {1} du {2} au {3}. L’équipe examine le justificatif et vous écrira avec sa décision. En attendant, votre place d’origine reste gardée.
reprogramacion.aprobada.asunto=Votre nouvelle date est confirmée - NativaTrips {0}
reprogramacion.aprobada.cuerpo=Bonjour {0}. Nous avons approuvé le changement : votre sortie à {1} a maintenant lieu le {2}, avec la place que vous avez déjà payée.\n\nVoici le lien de votre réservation avec la nouvelle date ; l’ancien ne fonctionne plus :\n{3}
reprogramacion.rechazada.asunto=Votre demande de changement de date n’a pas été approuvée - NativaTrips {0}
reprogramacion.rechazada.cuerpo=Bonjour {0}. L’équipe a examiné le justificatif et n’a pas pu approuver le changement{1}\n\nSelon la politique de reprogrammation (Annexe 16), la réservation est annulée et le paiement n’est pas remboursé. Si vous pensez qu’il y a une erreur, répondez à cet e-mail avec plus d’informations.
