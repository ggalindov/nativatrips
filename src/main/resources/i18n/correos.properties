reprogramacion.aprobada.cuerpo=Hola {0}. Aprobamos el cambio: tu salida a {1} ahora es el {2}, con el mismo cupo que ya pagaste.\n\nEste es el enlace de tu reserva con la fecha nueva; el anterior ya no sirve:\n{3}
