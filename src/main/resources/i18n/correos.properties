reprogramacion.solicitada.cuerpo=Hola {0}. Recibimos tu solicitud para pasar tu salida a {1} del {2} al {3}. El equipo revisa el soporte y te escribe con la decisión. Mientras tanto tu cupo original sigue guardado.
