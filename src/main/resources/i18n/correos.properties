reprogramacion.rechazada.cuerpo=Hola {0}. El equipo revisó el soporte y no pudo aprobar el cambio{1}\n\nSegún la política de reprogramación (Anexo 16), la reserva queda cancelada y el pago no se reembolsa. Si crees que hay un error, responde a este correo con más información.
