# Correos al turista en espanol (idioma por defecto). Cada idioma tiene su archivo correos_xx con
# las mismas claves. Formato MessageFormat: {0}, {1}... son los datos; un apostrofo se escribe ''.

cupo.asunto=Tu cupo esta apartado - NativaTrips {0}
cupo.cuerpo=Hola {0}. Apartamos {1} cupo(s) en {2} para el {3}. Tu codigo de reserva es {4}. El cupo se guarda hasta las {5} (hora de Colombia) mientras completas el pago.\n\nDesde este enlace pagas, registras a tus acompanantes y consultas tu reserva:\n{6}\n\nEs personal: no lo compartas. Si lo pierdes, pide uno nuevo con tu correo y el codigo.

