spring:
  application:
    name: nativatrips-backend
  # Correo saliente (RF-07, RF-34). Sin MAIL_HOST los correos solo se registran en el log.
  # Produccion: Gmail con contrasena de aplicacion (smtp.gmail.com:587). Local: Mailpit del compose.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USUARIO:}
    password: ${MAIL_CLAVE:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nativatrips}
    username: ${DB_USERNAME:nativatrips}
    password: ${DB_PASSWORD:nativatrips}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  # Detras de Nginx: la IP del visitante llega en X-Forwarded-For (limites de uso por visitante).
  forward-headers-strategy: framework

app:
  # Base de los enlaces que llegan por correo (recuperar la clave y, desde el Sprint 2, la reserva).
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  asistente:
    mensajes-por-hora: ${ASISTENTE_MENSAJES_POR_HORA:20}
  correo:
    # Direccion que ve el turista; si queda vacia se usa MAIL_USUARIO.
    remitente: ${MAIL_REMITENTE:}
  auth:
    # Amenaza A-04: fuerza bruta sobre el inicio de sesion del equipo.
    intentos-maximos: ${AUTH_INTENTOS_MAXIMOS:5}
    minutos-bloqueo: ${AUTH_MINUTOS_BLOQUEO:15}
  jwt:
    secret: ${APP_JWT_SECRET:}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:60}

# Sprint 2: integracion PayU WebCheckout. Los valores por defecto son las credenciales de
# pruebas PUBLICAS que PayU LATAM publica en su documentacion para el sandbox de Colombia
# (https://developers.payulatam.com) — sirven para probar el flujo completo sin cuenta real.
# En produccion se sobreescriben con las variables de entorno (cuenta real de la empresa).
payu:
  api-key: ${PAYU_API_KEY:4Vj8eK4rloUd272L48hsrarnUA}
  merchant-id: ${PAYU_MERCHANT_ID:508029}
  account-id: ${PAYU_ACCOUNT_ID:512321}
  test-mode: ${PAYU_TEST_MODE:true}
  currency: ${PAYU_CURRENCY:COP}
  checkout-url-sandbox: ${PAYU_CHECKOUT_URL_SANDBOX:https://sandbox.checkout.payulatam.com/ppp-web-gateway-payu/}
  checkout-url-produccion: ${PAYU_CHECKOUT_URL_PRODUCCION:https://checkout.payulatam.com/ppp-web-gateway-payu/}
  response-url: ${PAYU_RESPONSE_URL:http://localhost:3000/pagos/respuesta}
  confirmation-url: ${PAYU_CONFIRMATION_URL:http://localhost:8080/api/v1/pagos/confirmacion}

# Sprint 3: asistente conversacional. No hay credenciales de prueba publicas para Anthropic
# (a diferencia de PayU) — ANTHROPIC_API_KEY debe venir de una clave real para que el chat
# funcione; sin ella, el endpoint responde 503 con un mensaje claro, el resto de la app sigue
# funcionando con normalidad.
# ADR-005: pagos con Wompi. Las llaves solo en variables de entorno (repositorio publico);
# en desarrollo, las del sandbox (pub_test_..., prv_test_..., test_integrity_..., test_events_...).
wompi:
  llave-publica: ${WOMPI_LLAVE_PUBLICA:}
  llave-privada: ${WOMPI_LLAVE_PRIVADA:}
  secreto-integridad: ${WOMPI_SECRETO_INTEGRIDAD:}
  secreto-eventos: ${WOMPI_SECRETO_EVENTOS:}
  url-checkout: ${WOMPI_URL_CHECKOUT:https://checkout.wompi.co/p/}
  url-api: ${WOMPI_URL_API:https://sandbox.wompi.co/v1}
  moneda: COP

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-haiku-4-5}
  api-version: ${ANTHROPIC_API_VERSION:2023-06-01}
  base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
  max-tokens: ${ANTHROPIC_MAX_TOKENS:1024}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    # Una caida del proveedor de correo no debe marcar la aplicacion como caida.
    mail:
      enabled: false
