# Entorno completo de NativaTrips: base de datos, buzon de correo de pruebas, API y sitio web.
#   docker compose up -d --build
# Sitio: http://localhost:3000 · API: http://localhost:8080 · Correos: http://localhost:8025
name: nativatrips

services:
  postgres:
    image: postgres:16-alpine
    container_name: nativatrips-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-nativatrips}
      POSTGRES_USER: ${DB_USERNAME:-nativatrips}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nativatrips}
    ports:
      - "5432:5432"
    volumes:
      - nativatrips_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nativatrips} -d ${DB_NAME:-nativatrips}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Buzon de pruebas: atrapa todos los correos que envia el backend. En produccion se usa Gmail.
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: nativatrips-mailpit
    ports:
      - "8025:8025"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nativatrips-backend
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-nativatrips}
      DB_USERNAME: ${DB_USERNAME:-nativatrips}
      DB_PASSWORD: ${DB_PASSWORD:-nativatrips}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?la variable APP_JWT_SECRET es obligatoria, definela en tu .env}
      APP_JWT_EXPIRATION_MINUTES: ${APP_JWT_EXPIRATION_MINUTES:-60}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      AUTH_INTENTOS_MAXIMOS: ${AUTH_INTENTOS_MAXIMOS:-5}
      AUTH_MINUTOS_BLOQUEO: ${AUTH_MINUTOS_BLOQUEO:-15}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-true}
      # Correo: por defecto va a Mailpit; para Gmail se definen MAIL_* en el .env.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USUARIO: ${MAIL_USUARIO:-}
      MAIL_CLAVE: ${MAIL_CLAVE:-}
      MAIL_REMITENTE: ${MAIL_REMITENTE:-Eco Palacio Chingaza <reservas@ecopalacio.co>}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      # Asistente conversacional. Sin ANTHROPIC_API_KEY el chat responde 503; lo demas funciona igual.
      ASISTENTE_MENSAJES_POR_HORA: ${ASISTENTE_MENSAJES_POR_HORA:-20}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      ANTHROPIC_API_VERSION: ${ANTHROPIC_API_VERSION:-2023-06-01}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-1024}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_FUENTE_DATOS: ${VITE_FUENTE_DATOS:-http}
    container_name: nativatrips-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"

volumes:
  nativatrips_pgdata:
