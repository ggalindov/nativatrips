services:
  postgres:
    image: postgres:16-alpine
    container_name: nativatrips-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-nativatrips}
      POSTGRES_USER: ${DB_USERNAME:-nativatrips}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nativatrips}
    ports:
      - "5432:5432"
    volumes:
      - nativatrips_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nativatrips} -d ${DB_NAME:-nativatrips}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nativatrips-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-nativatrips}
      DB_USERNAME: ${DB_USERNAME:-nativatrips}
      DB_PASSWORD: ${DB_PASSWORD:-nativatrips}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?la variable APP_JWT_SECRET es obligatoria, definela en tu .env}
      APP_JWT_EXPIRATION_MINUTES: ${APP_JWT_EXPIRATION_MINUTES:-60}
      SPRING_PROFILES_ACTIVE: dev
      # Sprint 2 - PayU WebCheckout. Vacias => usa las credenciales de prueba publicas de PayU.
      PAYU_API_KEY: ${PAYU_API_KEY:-}
      PAYU_MERCHANT_ID: ${PAYU_MERCHANT_ID:-}
      PAYU_ACCOUNT_ID: ${PAYU_ACCOUNT_ID:-}
      PAYU_TEST_MODE: ${PAYU_TEST_MODE:-true}
      PAYU_CURRENCY: ${PAYU_CURRENCY:-COP}
      PAYU_RESPONSE_URL: ${PAYU_RESPONSE_URL:-http://localhost:3000/pagos/respuesta}
      PAYU_CONFIRMATION_URL: ${PAYU_CONFIRMATION_URL:-http://localhost:8080/api/v1/pagos/confirmacion}
    ports:
      - "8080:8080"

volumes:
  nativatrips_pgdata:
